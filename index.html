<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prayer Counter</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0;
      background: #f0f2f5; 
      display: flex;
      flex-direction: column;
      height: 100vh;
      touch-action: manipulation;
    }

    /* TOP HALF: Prayer Text Area */
    #prayer-text {
      position: relative;
      flex: 1;
      padding: 55px 20px 20px 20px; /* Extra top padding for font controls */
      overflow-y: auto;
      text-align: center;
      background: white;
      border-bottom: 2px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      /* Default font size base */
      font-size: 18px;
    }

    /* Font Controls (Top Right Corner) */
    .font-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .font-btn {
      background: #e5e5ea;
      border: none;
      color: #1a1a1a;
      font-weight: bold;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .font-btn:active {
      background: #007aff;
      color: white;
    }

    /* Relative Font Sizes (Scales proportionally) */
    .arabic { 
      font-size: 2.2em; 
      margin-bottom: 0.4em; 
      color: #1a1a1a;
      line-height: 1.4;
      font-family: "Amiri", "Scheherazade", "Arial", serif; 
    }
    .latin { 
      font-size: 1.1em; 
      font-style: italic; 
      color: #555; 
      margin-bottom: 0.4em; 
    }
    .kazakh { 
      font-size: 1.1em; 
      font-weight: bold; 
      color: #007aff; 
    }

    /* BOTTOM HALF: Counter Area */
    #counter-section {
      padding: 20px;
      text-align: center;
      background: #f0f2f5;
      padding-bottom: 40px;
    }

    #count { 
      font-size: 3.5rem; 
      font-weight: bold; 
      margin: 10px 0 20px 0; 
      color: #1a1a1a; 
    }

    #tapBtn { 
      width: 100%; 
      max-width: 400px; 
      height: 120px; 
      font-size: 2.5rem; 
      font-weight: bold;
      background: #007aff; 
      color: white; 
      border: none; 
      border-radius: 25px; 
      box-shadow: 0 8px 15px rgba(0, 122, 255, 0.2);
    }
    
    #tapBtn:active { 
      background: #005bb5; 
      transform: scale(0.97); 
    }

    #resetBtn { 
      background: transparent; 
      color: #ff3b30; 
      font-size: 1.1rem; 
      margin-top: 20px; 
      border: none; 
      padding: 10px 20px;
    }
  </style>
</head>
<body>

  <!-- Upper Screen: Prayer Text -->
  <div id="prayer-text">
    <div class="font-controls">
      <button class="font-btn" id="fontSmaller">A-</button>
      <button class="font-btn" id="fontLarger">A+</button>
    </div>
    <div class="arabic">سُبْحَانَ ٱللَّٰهِ</div>
    <div class="latin">Subḥān Allāh</div>
    <div class="kazakh">Алла пәк</div>
  </div>
  
  <!-- Lower Screen: Counter -->
  <div id="counter-section">
    <div id="count">0</div>
    <button id="tapBtn">TAP</button>
    <div>
      <button id="resetBtn">Reset Count</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
